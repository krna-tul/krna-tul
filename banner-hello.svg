<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="168" viewBox="0 0 1000 168" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd6e8"/>
      <stop offset="0.55" stop-color="#f3cdee"/>
      <stop offset="1" stop-color="#e3c6f5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <path d="M0,0 H1000 V146 C 800,166 620,152 500,156 C 360,159 170,148 0,158 Z" fill="url(#g)"/>
  <path d="M0,0 H1000 V146 C 800,166 620,152 500,156 C 360,159 170,148 0,158 Z" fill="url(#glow)"/>

  <!-- floating title -->
  <g>
    <text x="500" y="82" text-anchor="middle" font-size="46" font-weight="700"
          fill="#ffffff" letter-spacing="1">Hello, I&#39;m Karina</text>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -6; 0 0" keyTimes="0; 0.5; 1" dur="3.4s"
      calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"
      repeatCount="indefinite"/>
  </g>

  <!-- beating heart -->
  <g transform="translate(500,112)">
    <g>
      <path transform="translate(-11,-11)" fill="#ffffff"
            d="M11,19.3 C11,19.3 2.3,12.3 2.3,7.1 C2.3,4.4 4.5,2.5 6.9,2.5 C8.8,2.5 10.2,3.8 11,5.3 C11.8,3.8 13.2,2.5 15.1,2.5 C17.5,2.5 19.7,4.4 19.7,7.1 C19.7,12.3 11,19.3 11,19.3 Z"/>
      <animateTransform attributeName="transform" type="scale"
        values="1; 1.22; 1; 1.1; 1" keyTimes="0; 0.18; 0.36; 0.52; 1" dur="1.8s"
        calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
        repeatCount="indefinite"/>
    </g>
  </g>
</svg>